<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Video - Ferilion Office Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">📤 Upload a New Video</h2>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- Upload Form -->
    <form action="{{ url_for('upload_video') }}" method="POST" enctype="multipart/form-data" class="bg-white p-4 shadow rounded">
        <div class="mb-3">
            <label for="title" class="form-label">🎬 Video Title</label>
            <input type="text" class="form-control" id="title" name="title" placeholder="Enter video title" required>
        </div>

        <div class="mb-3">
            <label for="video" class="form-label">📁 Choose Video File</label>
            <input type="file" class="form-control" id="video" name="video" accept="video/*" required>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{{ url_for('home') }}" class="btn btn-secondary">⬅️ Back</a>
            <button type="submit" class="btn btn-primary">Upload ✅</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
