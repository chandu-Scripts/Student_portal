<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4 text-center">📚 Upload Notes</h2>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- Upload Notes Form -->
    <form method="POST" enctype="multipart/form-data" class="border p-4 bg-white shadow rounded">
        <div class="mb-3">
            <label for="title" class="form-label">📝 Note Title</label>
            <input type="text" class="form-control" id="title" name="title" placeholder="Enter note title" required>
        </div>

        <div class="mb-3">
            <label for="note" class="form-label">📎 Upload File (PDF/DOC/PPT/XLS)</label>
            <input type="file" class="form-control" id="note" name="note" required>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{{ url_for('home') }}" class="btn btn-secondary">⬅️ Back to Home</a>
            <button type="submit" class="btn btn-primary">Upload ✅</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
